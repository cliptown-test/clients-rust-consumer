name: verify oreslang-format pr9

on:
  pull_request:
    paths:
      - '_ci/oreslang-format-pr9/**'
      - '.github/workflows/verify-oreslang-format-pr9.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: cargo test --all-targets --manifest-path _ci/oreslang-format-pr9/Cargo.toml
